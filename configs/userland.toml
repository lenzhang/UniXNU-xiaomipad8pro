# The userland of native macOS on piano (docs/userland.md): every program and launchd job this repository puts on the tablet, where
# it goes, with which owner and mode, and whether its job runs in the installed profile. tooling/userland/stage.py builds the files,
# signs the Mach-Os ad hoc (the linker's signature), puts them into a copy of the Data seed (or a live update's bundle) under
# `staging`, adds the Mach-Os' CDHashes to the trust cache and writes the record; the seed's boot job then runs the staged
# install.sh, which installs them with these owners and modes.
#
# [[unit]]       one piece: name, about, default_on (its launchd job runs in the installed profile: loaded at install; false: the
#                job file is installed with Disabled and the owner turns it on with launchctl enable), status = "planned" (listed,
#                not built or staged). A unit has at most one launchd job; a unit without one is a command-line tool and is always
#                installed (default_on must be true).
# [[unit.file]]  one installed file:
#   dest         its path on the tablet: /Library/LaunchDaemons/<Label>.plist, /Library/LaunchAgents/<Label>.plist (a launchd job,
#                root:wheel 0644: launchd refuses any other), /usr/local/bin/<name> (commands), /usr/local/libexec/<name> (helpers),
#                /usr/local/share/piano/wallpaper/<name> (the still wallpaper's data files)
#   owner, mode  default "root:wheel"; mode in octal ("0755" programs and scripts, "0644" job files)
#   build        "copy": `source` as it is
#                "cc": xcrun clang for `arch` (arm64, or arm64e), macOS `min_os` (default 14.0), -O2 -Wall -Wextra -Werror, `cflags`,
#                      `frameworks`; `source` (or `sources`) compiled and linked in one step, output named as dest (the linker's ad
#                      hoc signature names the file, so the CDHash is the installed file's)
#                "script": `command` (an argv, run from the repository root) builds `output`; `inputs` (globs) are what the build
#                      stamp covers: unchanged inputs, no rebuild, the same bytes and the same CDHash
#   trust        a Mach-O's CDHash goes into the trust cache (default true; a script or plist has none)

format = 1
staging = "/private/var/piano/userland"

[[unit]]
name = "pianousb-shell"
about = "the root shell on PianoDwc3's user pipe (docs/drivers/usb-device-debug.md section 6); exits at once without the kernel argument piano-usb-shell=1"
default_on = true

[[unit.file]]
source = "tooling/native/pianousb-shell/pianousb-shell.c"
build = "cc"
arch = "arm64"
dest = "/usr/local/libexec/pianousb-shell"
mode = "0755"

[[unit.file]]
source = "tooling/native/pianousb-shell/com.unixnu.pianousb-shell.plist"
build = "copy"
dest = "/Library/LaunchDaemons/com.unixnu.pianousb-shell.plist"
mode = "0644"

[[unit]]
name = "piano-policy-agent"
about = "PianoPolicy's agent (docs/policy.md section 4): Low Power Mode into machdep.piano_policy_lpm, display sleep on a cover closed without sleep; event driven"
default_on = true

[[unit.file]]
source = "tooling/native/piano-policy-agent/piano-policy-agent.sh"
build = "copy"
dest = "/usr/local/libexec/piano-policy-agent"
mode = "0755"

[[unit.file]]
source = "tooling/native/piano-policy-agent/com.unixnu.piano-policy-agent.plist"
build = "copy"
dest = "/Library/LaunchDaemons/com.unixnu.piano-policy-agent.plist"
mode = "0644"

[[unit]]
name = "piano-rotated"
about = "PianoAuto's display rotation agent (docs/drivers/sensors.md section 5a); exits at once without the kernel argument piano-rotate"
default_on = true

[[unit.file]]
build = "script"
command = ["tooling/k27/build-piano-rotated.sh"]
output = "out/piano-rotated/piano-rotated"
inputs = ["tooling/k27/build-piano-rotated.sh", "package/PianoAuto/*.[ch]", "package/PianoAuto/daemon/*", "package/PianoAuto/tests/*",
          "package/PianoSensors/*.[ch]", "package/PianoBacklight/*.h", "package/include/*.h"]
dest = "/usr/local/libexec/piano-rotated"
mode = "0755"

[[unit.file]]
source = "package/PianoAuto/daemon/com.unixnu.piano-rotated.plist"
build = "copy"
dest = "/Library/LaunchAgents/com.unixnu.piano-rotated.plist"
mode = "0644"

[[unit]]
name = "piano-torch"
about = "the rear torch from macOS (docs/drivers/torch.md section 5): sudo piano-torch on|off|toggle|status; needs PianoTorch at piano-torch=2"
default_on = true

[[unit.file]]
source = "tooling/native/piano-torch/piano-torch.c"
build = "cc"
arch = "arm64"
frameworks = ["IOKit", "CoreFoundation"]
dest = "/usr/local/bin/piano-torch"
mode = "0755"

[[unit]]
name = "piano-camera-grab"
about = "one capture per camera through PianoCamera's user client (docs/drivers/camera.md section 4.5): sudo piano-camera-grab [front|rear|both] writes /private/var/tmp/piano-camera-<sensor>.ppm; its job runs once at boot only with the kernel arguments piano-camera=5 piano-camera-grab=1 and prints its results and thumbnails on the console"
default_on = true

[[unit.file]]
source = "tooling/native/piano-camera-grab/piano-camera-grab.c"
build = "cc"
arch = "arm64"
cflags = ["-I", "package/PianoCamera"]
frameworks = ["IOKit", "CoreFoundation"]
dest = "/usr/local/bin/piano-camera-grab"
mode = "0755"

[[unit.file]]
source = "tooling/native/piano-camera-grab/com.unixnu.piano-camera-grab.plist"
build = "copy"
dest = "/Library/LaunchDaemons/com.unixnu.piano-camera-grab.plist"
mode = "0644"

[[unit]]
name = "piano-pmset-defaults"
about = "the recommended pmset timers (docs/policy.md section 7) set once per power source, unless the owner set that source's timers first"
default_on = true

[[unit.file]]
source = "tooling/userland/piano-pmset-defaults.sh"
build = "copy"
dest = "/usr/local/libexec/piano-pmset-defaults"
mode = "0755"

[[unit.file]]
source = "tooling/userland/com.unixnu.piano-pmset-defaults.plist"
build = "copy"
dest = "/Library/LaunchDaemons/com.unixnu.piano-pmset-defaults.plist"
mode = "0644"

[[unit]]
name = "piano-login-front"
about = "once at login, the Finder brought to the front: on the owner's Data the session could start with AccessibilityUIServer frontmost, which keeps the menu bar off the screen (2026-11-13)"
default_on = true

[[unit.file]]
source = "tooling/userland/piano-login-front/piano-login-front.sh"
build = "copy"
dest = "/usr/local/libexec/piano-login-front"
mode = "0755"

[[unit.file]]
source = "tooling/userland/piano-login-front/com.unixnu.piano-login-front.plist"
build = "copy"
dest = "/Library/LaunchAgents/com.unixnu.piano-login-front.plist"
mode = "0644"

[[unit]]
name = "piano-still-wallpaper"
about = "Apple's stock default still picture (the system volume's DefaultDesktop.heic, converted once a boot; one-colour fallback): writes absent wallpaper choices and replaces only our earlier UniXNU Still/generated choices, never the user's; no software video decode"
default_on = true

[[unit.file]]
source = "tooling/k27/still-wallpaper.sh"
build = "copy"
dest = "/usr/local/libexec/piano-still-wallpaper"
mode = "0755"

[[unit.file]]
build = "script"
command = ["python3", "tooling/k27/still-wallpaper.py", "out/still-wallpaper"]
output = "out/still-wallpaper/still.png"
inputs = ["tooling/k27/still-wallpaper.py"]
dest = "/usr/local/share/piano/wallpaper/still.png"
mode = "0644"
trust = false

[[unit.file]]
build = "script"
command = ["python3", "tooling/k27/still-wallpaper.py", "out/still-wallpaper"]
output = "out/still-wallpaper/Metadata.plist"
inputs = ["tooling/k27/still-wallpaper.py"]
dest = "/usr/local/share/piano/wallpaper/Metadata.plist"
mode = "0644"
trust = false

[[unit.file]]
build = "script"
command = ["python3", "tooling/k27/still-wallpaper.py", "out/still-wallpaper"]
output = "out/still-wallpaper/Index.plist"
inputs = ["tooling/k27/still-wallpaper.py"]
dest = "/usr/local/share/piano/wallpaper/Index.plist"
mode = "0644"
trust = false

[[unit.file]]
source = "tooling/userland/com.unixnu.piano-still-wallpaper.plist"
build = "copy"
dest = "/Library/LaunchDaemons/com.unixnu.piano-still-wallpaper.plist"
mode = "0644"

[[unit]]
name = "piano-wifi-supplicant"
about = "the WPA2-Personal key handshake of PianoWifi's station over its 802.1X port (docs/drivers/wifi.md section 13.7): reads the root-only join profile, answers the four-way and group handshakes, hands the keys to the kext and opens the port; logs states and lengths only"
default_on = true

[[unit.file]]
source = "tooling/native/piano-wifi-supplicant/piano-wifi-supplicant.c"
build = "cc"
arch = "arm64"
dest = "/usr/local/libexec/piano-wifi-supplicant"
mode = "0755"

[[unit.file]]
source = "tooling/native/piano-wifi-supplicant/com.unixnu.piano-wifi-supplicant.plist"
build = "copy"
dest = "/Library/LaunchDaemons/com.unixnu.piano-wifi-supplicant.plist"
mode = "0644"

[[unit]]
name = "piano-wifi-join"
about = "hands PianoWifi the join profile once at boot, from the root-only file /private/var/db/piano-wifi/profile (the owner places it; never in a repository) into the root-only sysctl machdep.piano_wifi_join; logs lengths only (docs/drivers/wifi.md section 13.2); exits at once with no profile or no PianoWifi"
default_on = true

[[unit.file]]
source = "tooling/native/piano-wifi-join/piano-wifi-join.c"
build = "cc"
arch = "arm64"
dest = "/usr/local/libexec/piano-wifi-join"
mode = "0755"

[[unit.file]]
source = "tooling/native/piano-wifi-join/com.unixnu.piano-wifi-join.plist"
build = "copy"
dest = "/Library/LaunchDaemons/com.unixnu.piano-wifi-join.plist"
mode = "0644"

[[unit]]
name = "piano-airportd-kick"
about = "airportd started (launchctl kickstart, once) when PianoWifi80211 answers the apple80211 requests and launchd's IO80211Controller match has not started it within 10 s (docs/drivers/wifi-menu.md section 5); does nothing without the kernel argument piano-wifi-apple80211=1 (the controller never appears); a script, no Mach-O"
default_on = true

[[unit.file]]
source = "tooling/userland/piano-airportd-kick/piano-airportd-kick.sh"
build = "copy"
dest = "/usr/local/libexec/piano-airportd-kick"
mode = "0755"

[[unit.file]]
source = "tooling/userland/piano-airportd-kick/com.unixnu.piano-airportd-kick.plist"
build = "copy"
dest = "/Library/LaunchDaemons/com.unixnu.piano-airportd-kick.plist"
mode = "0644"

[[unit]]
name = "piano-wifi"
about = "the Wi-Fi command-line tool of docs/drivers/wifi.md section 13.1 (scan, join, status over PianoWifi's control socket); not written yet"
status = "planned"
default_on = true

[[unit.file]]
source = "tooling/native/piano-wifi/piano-wifi.c"
build = "cc"
arch = "arm64"
frameworks = ["CoreFoundation"]
dest = "/usr/local/bin/piano-wifi"
mode = "0755"
